<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DownIt · Minecraft 下载器</title>
<style>
  :root {
    --bg: #f4f5f2;
    --panel: #ffffff;
    --ink: #1b211c;
    --muted: #6f7a71;
    --line: #e3e7df;
    --accent: #2f8f4e;
    --accent-dark: #236b3b;
    --accent-soft: #eaf5ec;
    --warn: #a86400;
    --danger: #b3382c;
    --radius: 14px;
    --mono: ui-monospace, SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono, .pre { font-family: var(--mono); }

  /* ---------- 顶栏 ---------- */
  .top {
    position: sticky; top: 0; z-index: 20;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
    padding: 14px 28px;
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 auto; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #37a25b, #226b3b);
    color: #fff; font-size: 18px; font-weight: 700;
    box-shadow: 0 4px 12px rgba(47,143,78,.28);
  }
  h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  .sub { margin: 1px 0 0; font-size: 12px; color: var(--muted); }
  .meta { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .meta-item { display: flex; flex-direction: column; align-items: flex-end; min-width: 0; }
  .meta-item span { font-size: 11px; color: var(--muted); }
  .meta-item code { font-size: 12px; color: #3b463d; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(47,143,78,.14); }

  /* ---------- 布局 ---------- */
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 384px; gap: 18px;
    max-width: 1320px; margin: 0 auto; padding: 18px 28px 44px;
    align-items: start;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(27,33,28,.03);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  .panel-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .side { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 86px; }

  /* ---------- 版本列表 ---------- */
  .filters { display: flex; gap: 8px; }
  input[type="text"], input:not([type]), select {
    height: 32px; padding: 0 10px; border-radius: 9px;
    border: 1px solid var(--line); background: #fbfcfa; color: var(--ink);
    font: inherit; font-size: 13px; outline: none;
  }
  input:focus, select:focus { border-color: #b7d8bf; box-shadow: 0 0 0 3px rgba(47,143,78,.10); background: #fff; }
  #search { width: 150px; }
  #kind { padding-right: 6px; }
  .list { max-height: clamp(320px, calc(100vh - 236px), 720px); overflow-y: auto; padding: 6px; overscroll-behavior: contain; }
  .row {
    display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent; transition: background .12s, border-color .12s;
  }
  .row:hover { background: #f7f9f5; }
  .row.selected { background: var(--accent-soft); border-color: #cbe6d2; }
  .row-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .vid { font-family: var(--mono); font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tag {
    font-size: 11px; line-height: 1; padding: 3px 7px; border-radius: 999px;
    background: #f0f2ee; color: var(--muted); white-space: nowrap;
  }
  .tag.installed { background: #eaf5ec; color: #297a44; }
  .tag.snapshot { background: #fdf3e3; color: var(--warn); }
  .empty { padding: 28px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ---------- 安装面板 ---------- */
  .panel-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label { font-size: 12px; color: var(--muted); }
  .field.inline { flex-direction: row; align-items: center; justify-content: space-between; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: #f2f4ef; padding: 4px; border-radius: 10px; }
  .seg button {
    border: 0; background: transparent; height: 30px; border-radius: 7px;
    font: inherit; font-size: 13px; color: #4c574e; cursor: pointer;
  }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(27,33,28,.10); font-weight: 600; }
  .primary {
    width: 100%; height: 40px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background .15s, transform .05s;
  }
  .primary:hover { background: var(--accent-dark); }
  .primary:active { transform: translateY(1px); }
  .primary:disabled { background: #c8d3c9; cursor: not-allowed; }
  .hint { margin: 0; font-size: 12px; color: var(--muted); }
  .check { width: 16px; height: 16px; accent-color: var(--accent); }

  /* ---------- 进度 ---------- */
  .bar { height: 8px; border-radius: 999px; background: #eef1ec; overflow: hidden; margin: 14px 16px 8px; }
  .bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, #4fb56e, #2f8f4e); transition: width .25s ease; }
  .progress-meta {
    display: flex; gap: 12px; padding: 0 16px 8px;
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .progress-meta #pct { color: var(--ink); font-weight: 600; }
  .log {
    margin: 0; padding: 12px 16px 16px; height: 268px; overflow-y: auto;
    background: #fbfcfa; border-top: 1px solid var(--line);
    border-radius: 0 0 var(--radius) var(--radius);
    font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: #3f4a42;
    white-space: pre-wrap; word-break: break-word;
  }
  .log .err { color: var(--danger); }
  .log .ok { color: var(--accent-dark); }
  .chip {
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
    background: #f0f2ee; color: var(--muted); white-space: nowrap;
  }
  .chip.running { background: #fdf3e3; color: var(--warn); }
  .chip.done { background: #eaf5ec; color: #297a44; }
  .chip.error { background: #fbeceb; color: var(--danger); }

  @media (max-width: 900px) {
    .meta-item { display: none; }
  }
  @media (max-width: 1020px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 14px 16px 32px; }
    .top { padding: 12px 16px; }
    .side { position: static; }
    .list { max-height: 38vh; }
    .sub { font-size: 11px; }
  }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo">▣</div>
      <div>
        <h1>DownIt <span style="font-weight:400;color:var(--muted);font-size:12px" id="ver"></span></h1>
        <p class="sub">Minecraft 下载器 · Mojang CDN / Fabric / Forge</p>
      </div>
    </div>
    <div class="meta">
      <div class="meta-item"><span>游戏目录</span><code id="gameDir">加载中…</code></div>
      <div class="dot"><i></i>本地服务</div>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2>版本列表 <span class="chip" id="latest" style="margin-left:6px"></span></h2>
        <div class="filters">
          <input id="search" placeholder="搜索版本号" />
          <select id="kind">
            <option value="release">正式版</option>
            <option value="snapshot">快照</option>
            <option value="all">全部</option>
          </select>
        </div>
      </div>
      <div id="list" class="list"><div class="empty">正在获取版本清单…</div></div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="panel-head"><h2>安装</h2><span class="chip" id="selected">未选择版本</span></div>
        <div class="panel-body">
          <div class="field">
            <label>模组加载器</label>
            <div class="seg" id="loader">
              <button data-v="none" class="on">原版</button>
              <button data-v="fabric">Fabric</button>
              <button data-v="forge">Forge</button>
            </div>
          </div>
          <div class="field" id="loaderVersionField" hidden>
            <label>加载器版本</label>
            <input id="loaderVersion" placeholder="留空 = 最新稳定版" />
          </div>
          <div class="field inline">
            <label for="skipAssets">跳过资源文件（更快，但游戏内无声音）</label>
            <input type="checkbox" id="skipAssets" class="check" />
          </div>
          <div class="field">
            <label>下载源</label>
            <select id="mirror">
              <option value="auto">自动测速</option>
              <option value="official">Mojang 官方</option>
              <option value="bmclapi">BMCLAPI 国内镜像</option>
            </select>
          </div>
          <button id="go" class="primary" disabled>开始下载</button>
          <p class="hint" id="hint">从左侧选择一个版本</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>进度</h2><span class="chip" id="status">空闲</span></div>
        <div class="bar"><div id="bar"></div></div>
        <div class="progress-meta">
          <span id="pct">0%</span><span id="bytes">—</span><span id="files"></span>
        </div>
        <pre id="log" class="log"></pre>
      </section>
    </aside>
  </main>

<script>
const $ = (sel) => document.querySelector(sel);
const listEl = $('#list'), logEl = $('#log');
let versions = [], selected = null, loader = 'none';
let installed = new Map();
let jobId = null, since = 0, pollTimer = null;

const fmtBytes = (n) => {
  if (!n) return '—';
  const units = ['B', 'KB', 'MB', 'GB'];
  let v = n, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + ' ' + units[i];
};

function logLine(text, cls) {
  const nearBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  const span = document.createElement('div');
  if (cls) span.className = cls;
  span.textContent = text;
  logEl.appendChild(span);
  if (nearBottom) logEl.scrollTop = logEl.scrollHeight;
  while (logEl.childElementCount > 400) logEl.removeChild(logEl.firstChild);
}

function setStatus(status) {
  const el = $('#status');
  el.className = 'chip';
  if (status === 'running') { el.textContent = '进行中'; el.classList.add('running'); }
  else if (status === 'done') { el.textContent = '完成'; el.classList.add('done'); }
  else if (status === 'error') { el.textContent = '失败'; el.classList.add('error'); }
  else { el.textContent = '空闲'; }
  const busy = status === 'running';
  $('#go').disabled = busy || !selected;
}

function updateBar(ev) {
  let pct = 0;
  if (ev.total > 0) pct = Math.min(100, ev.done / ev.total * 100);
  else if (ev.files_total) pct = Math.min(100, ev.files / ev.files_total * 100);
  $('#bar').style.width = pct.toFixed(1) + '%';
  $('#pct').textContent = pct.toFixed(0) + '%';
  $('#bytes').textContent = fmtBytes(ev.done) + (ev.total ? ' / ' + fmtBytes(ev.total) : '');
  $('#files').textContent = ev.files_total ? ev.files + ' / ' + ev.files_total + ' 个文件' : '';
}

function render() {
  const kind = $('#kind').value;
  const needle = $('#search').value.trim().toLowerCase();
  let rows = versions.filter(v => (kind === 'all' || v.type === kind) && (!needle || v.id.toLowerCase().includes(needle)));
  listEl.innerHTML = '';
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">没有匹配的版本</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  rows.slice(0, 200).forEach(v => {
    const row = document.createElement('div');
    row.className = 'row' + (selected === v.id ? ' selected' : '');
    row.onclick = () => { selected = v.id; $('#selected').textContent = v.id; $('#hint').textContent = '将安装到 ' + $('#gameDir').textContent; render(); setStatus(jobId ? 'running' : 'idle'); };
    const main = document.createElement('div');
    main.className = 'row-main';
    const id = document.createElement('span');
    id.className = 'vid'; id.textContent = v.id;
    main.appendChild(id);
    if (v.type === 'snapshot') {
      const t = document.createElement('span'); t.className = 'tag snapshot'; t.textContent = '快照'; main.appendChild(t);
    }
    if (installed.has(v.id)) {
      const t = document.createElement('span'); t.className = 'tag installed'; t.textContent = '已安装'; main.appendChild(t);
    }
    const date = document.createElement('span');
    date.className = 'date'; date.textContent = v.releaseTime || '';
    row.append(main, date);
    frag.appendChild(row);
  });
  listEl.appendChild(frag);
}

async function loadState() {
  try {
    const s = await fetch('/api/state').then(r => r.json());
    $('#gameDir').textContent = s.game_dir;
    $('#gameDir').title = s.game_dir;
    $('#ver').textContent = 'v' + s.version;
    installed = new Map((s.installed || []).map(v => [v.id, v.loader]));
    if (s.busy && s.job && !jobId) attach(s.job);
    render();
  } catch (e) { /* 服务刚启动时忽略 */ }
}

async function loadVersions() {
  try {
    const data = await fetch('/api/versions').then(r => r.json());
    versions = data.versions || [];
    if (data.latest) $('#latest').textContent = '最新 ' + data.latest.release;
    if (data.error) logLine('获取版本清单失败：' + data.error, 'err');
    render();
  } catch (e) {
    listEl.innerHTML = '<div class="empty">无法连接本地服务</div>';
  }
}

async function start() {
  if (!selected) return;
  const body = {
    version: selected,
    loader,
    loader_version: $('#loaderVersion').value,
    skip_assets: $('#skipAssets').checked,
    mirror: $('#mirror').value
  };
  logEl.innerHTML = '';
  resetBar();
  setStatus('running');
  try {
    const res = await fetch('/api/install', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) { logLine('× ' + (data.error || '启动失败'), 'err'); setStatus('error'); return; }
    attach(data.job);
  } catch (e) {
    logLine('× ' + e.message, 'err');
    setStatus('error');
  }
}

function resetBar() {
  $('#bar').style.width = '0%';
  $('#pct').textContent = '0%';
  $('#bytes').textContent = '—';
  $('#files').textContent = '';
}

function attach(id) {
  jobId = id; since = 0;
  setStatus('running');
  poll();
}

async function poll() {
  if (!jobId) return;
  clearTimeout(pollTimer);
  try {
    const res = await fetch(`/api/jobs/${jobId}?since=${since}`);
    if (!res.ok) { jobId = null; return; }
    const data = await res.json();
    (data.events || []).forEach(ev => {
      if (ev.kind === 'log') logLine(ev.text, /^×|错误|失败/.test(ev.text) ? 'err' : (/^完成|✓/.test(ev.text) ? 'ok' : ''));
      else if (ev.kind === 'progress') updateBar(ev);
      else if (ev.kind === 'status') setStatus(ev.status);
    });
    since = data.next ?? since;
    if (data.status === 'done' || data.status === 'error') {
      jobId = null;
      setStatus(data.status);
      await loadState();
      return;
    }
  } catch (e) { /* 网络抖动，继续轮询 */ }
  pollTimer = setTimeout(poll, 600);
}

$('#kind').addEventListener('change', render);
$('#search').addEventListener('input', render);
$('#go').addEventListener('click', start);
$('#loader').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  loader = btn.dataset.v;
  [...$('#loader').children].forEach(b => b.classList.toggle('on', b === btn));
  $('#loaderVersionField').hidden = loader === 'none';
  $('#loaderVersion').placeholder = loader === 'forge' ? 'latest / recommended / 版本号' : '留空 = 最新稳定版';
});

loadState();
loadVersions();
</script>
</body>
</html>
